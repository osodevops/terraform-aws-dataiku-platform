name: "Gownly Stripe - Terraform"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "terraform/environments/*/gownly/**"
      - "terraform/modules/gownly-stripe/**"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/environments/*/gownly/**"
      - "terraform/modules/gownly-stripe/**"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"

jobs:
  plan-test:
    name: "Plan (test)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/test/gownly/stripe
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}" -no-color
        continue-on-error: true

  plan-prod:
    name: "Plan (prod)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/prod/gownly/stripe
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }}" -no-color
        continue-on-error: true

  apply-test:
    name: "Apply (test)"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [plan-test]
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: terraform/environments/test/gownly/stripe
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}"

  apply-prod:
    name: "Apply (prod)"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [apply-test]
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/environments/prod/gownly/stripe
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }}"
